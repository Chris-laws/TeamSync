<script>
const urlState=new URLSearchParams(location.search);
const App={state:{view:urlState.get('view')||'dashboard',data:null,filters:{},selected:new Set(),sort:{key:'updatedAt',dir:-1},detail:null,theme:urlState.get('theme')||localStorage.getItem('teamsync-theme')||'light'},nav:[['dashboard','◫','Dashboard'],['my-tasks','✓','My Tasks'],['all-tasks','☷','All Tasks'],['kanban','▦','Kanban Board'],['projects','◇','Projects'],['completed','●','Completed Tasks']],labels:{backlog:'Backlog',todo:'To Do',in_progress:'In Progress',in_review:'In Review',done:'Done',cancelled:'Cancelled'},priorities:['critical','high','medium','low']};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmtDate=v=>v?new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',year:'numeric'}).format(new Date(v+'T12:00:00')):'No date';
const initials=n=>String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const avatar=u=>u&&u.photoUrl?`<img class="avatar" src="${esc(u.photoUrl)}" alt="">`:`<span class="avatar">${esc(initials(u&&u.displayName))}</span>`;
const person=id=>App.state.data.users.find(u=>u.userId===id)||{displayName:'Unknown'};
const project=id=>App.state.data.projects.find(p=>p.projectId===id)||{name:'No project'};
const chip=(type,v)=>`<span class="chip ${type}-${esc(v)}">${esc(type==='status'?App.labels[v]||v:v[0].toUpperCase()+v.slice(1))}</span>`;
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(Object.assign(new Error(r?.error?.message||'Request failed'),r?.error))).withFailureHandler(reject)[name](...args));}
function toast(message,type=''){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;$('#toastRoot').append(el);setTimeout(()=>el.remove(),3500)}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function setTheme(theme,persist=true){App.state.theme=theme;$('#app').dataset.theme=theme;localStorage.setItem('teamsync-theme',theme);if(persist&&App.state.data)call('apiSavePreferences',Object.assign({},App.state.data.preferences,{theme})).then(v=>App.state.data.preferences=v).catch(()=>{})}
function renderNav(){ $('#primaryNav').innerHTML=App.nav.map(([id,icon,label])=>`<button class="nav-item ${App.state.view===id?'active':''}" data-view="${id}"><span>${icon}</span><span>${label}</span></button>`).join(''); }
function renderUser(){const u=App.state.data.user;$('#sidebarUser').classList.remove('skeleton');$('#sidebarUser').innerHTML=`${avatar(u)}<div><strong>${esc(u.displayName||'Profile unresolved')}</strong><div class="meta">${esc(u.role)}</div></div>`;$('#userPill').classList.remove('skeleton');$('#userPill').innerHTML=`${avatar(u)}<span>${esc(u.displayName||u.email)}</span>`}
function pageHead(kicker,title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div>${action}</div>`}
function filteredTasks(base=App.state.data.tasks){const f=App.state.filters,q=(f.search||'').toLowerCase(),today=new Date().toISOString().slice(0,10);return base.filter(t=>(!q||(t.title+' '+t.description).toLowerCase().includes(q))&&(!f.status||t.status===f.status)&&(!f.priority||t.priority===f.priority)&&(!f.projectId||t.projectId===f.projectId)&&(!f.assigneeId||t.assigneeId===f.assigneeId)&&(!f.due||f.due==='overdue'&&t.dueDate&&t.dueDate<today&&t.status!=='done'||f.due==='today'&&t.dueDate===today||f.due==='upcoming'&&t.dueDate>today||f.due==='none'&&!t.dueDate)).sort((a,b)=>{const x=a[App.state.sort.key]||'',y=b[App.state.sort.key]||'';return String(x).localeCompare(String(y),undefined,{numeric:true})*App.state.sort.dir})}
function taskFilters(){return `<div class="toolbar"><input id="taskSearch" value="${esc(App.state.filters.search||'')}" placeholder="Search tasks"><select data-filter="status"><option value="">All statuses</option>${Object.entries(App.labels).map(([v,l])=>`<option value="${v}" ${App.state.filters.status===v?'selected':''}>${l}</option>`).join('')}</select><select data-filter="priority"><option value="">All priorities</option>${App.priorities.map(v=>`<option value="${v}" ${App.state.filters.priority===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select><select data-filter="projectId"><option value="">All projects</option>${App.state.data.projects.map(p=>`<option value="${p.projectId}" ${App.state.filters.projectId===p.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select><select data-filter="assigneeId"><option value="">All assignees</option>${App.state.data.users.map(u=>`<option value="${u.userId}" ${App.state.filters.assigneeId===u.userId?'selected':''}>${esc(u.displayName)}</option>`).join('')}</select><select data-filter="due"><option value="">Any due date</option>${[['overdue','Overdue'],['today','Due today'],['upcoming','Upcoming'],['none','No due date']].map(([v,l])=>`<option value="${v}" ${App.state.filters.due===v?'selected':''}>${l}</option>`).join('')}</select><button class="btn btn-secondary" id="clearFilters">Clear</button><span class="meta">${filteredTasks().length} tasks</span></div>`}
function render(){renderNav();const main=$('#main');if(App.state.view==='dashboard')main.innerHTML=dashboardView();else if(['all-tasks','my-tasks','completed'].includes(App.state.view))main.innerHTML=tasksView();else if(App.state.view==='kanban')main.innerHTML=kanbanView();else if(App.state.view==='projects')main.innerHTML=projectsView();else if(App.state.view==='profile')main.innerHTML=profileView();else main.innerHTML=settingsView();bindView();main.focus()}
function dashboardView(){const d=App.state.data.dashboard,u=App.state.data.user;return `<section class="welcome"><div><div class="eyebrow">${new Intl.DateTimeFormat(undefined,{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</div><h1>${greeting()}, ${esc((u.givenName||u.displayName||'there').split(' ')[0])}.</h1><p>Here’s what needs your attention today.</p></div><button class="btn btn-primary" data-add>＋ Create new task</button></section><div class="stats-grid">${[['◫',d.open,'My open tasks'],['◷',d.inProgress,'In progress'],['✓',d.completed,'Completed'],['△',d.overdue,'Overdue']].map(x=>`<article class="stat-card"><div class="stat-icon">${x[0]}</div><div class="stat-value">${x[1]}</div><div class="stat-label">${x[2]}</div></article>`).join('')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><h2>Project overview</h2><button class="btn btn-secondary" data-view="projects">View all</button></div><div class="project-cards">${App.state.data.projects.length?App.state.data.projects.slice(0,6).map(projectCard).join(''):'<div class="empty"><strong>No projects yet</strong>An administrator can create the first project.</div>'}</div></section><section class="panel"><div class="panel-head"><h2>Upcoming deadlines</h2><button class="btn btn-secondary" data-view="my-tasks">View all</button></div><div class="focus-list">${d.upcoming.length?d.upcoming.map(focusItem).join(''):'<div class="empty"><strong>Nothing urgent</strong>Your schedule is clear.</div>'}</div></section></div>`}
function projectCard(p){return `<article class="project-card" data-project-detail="${p.projectId}"><div class="meta">${esc(p.status.toUpperCase())}</div><h3>${esc(p.name)}</h3><div class="progress"><i style="width:${p.progress}%"></i></div><div class="progress-row"><span>${p.completedCount}/${p.taskCount} complete</span><strong>${p.progress}%</strong></div></article>`}
function focusItem(t){return `<article class="focus-item" data-task="${t.taskId}"><span class="status-dot"></span><div><div class="focus-title">${esc(t.title)}</div><div class="meta">${chip('priority',t.priority)} <span>${esc(project(t.projectId).name)}</span><span>${fmtDate(t.dueDate)}</span></div></div></article>`}
function tasksView(){let tasks=App.state.data.tasks,title='All Tasks',sub='Manage and organise every authorised task in one place.';if(App.state.view==='my-tasks'){tasks=tasks.filter(t=>t.assigneeId===App.state.data.user.userId);title='My Tasks';sub='Work assigned to you, grouped around your schedule.'}if(App.state.view==='completed'){tasks=tasks.filter(t=>t.status==='done');title='Completed Tasks';sub='Review work that has crossed the finish line.'}const filtered=filteredTasks(tasks),content=App.state.view==='my-tasks'?myTaskGroups(filtered):(filtered.length?`<div class="table-wrap">${taskTable(filtered)}</div>`:'<div class="table-wrap"><div class="empty"><strong>No tasks found</strong>Try changing your filters or create a new task.</div></div>');return `${pageHead('Workspace',title,sub,'<button class="btn btn-primary" data-add>＋ New task</button>')}${taskFilters()}${App.state.selected.size?`<div class="bulkbar"><strong>${App.state.selected.size} selected</strong><select id="bulkStatus"><option value="">Change status…</option>${Object.entries(App.labels).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="btn btn-secondary" id="clearSelection">Clear</button></div><br>`:''}${content}`}
function myTaskGroups(tasks){const today=new Date().toISOString().slice(0,10),groups=[['Overdue',t=>t.status!=='done'&&t.dueDate&&t.dueDate<today],['Today',t=>t.status!=='done'&&t.dueDate===today],['Upcoming',t=>t.status!=='done'&&t.dueDate>today],['No due date',t=>t.status!=='done'&&!t.dueDate],['Completed',t=>t.status==='done']];let found=false;const html=groups.map(([label,test])=>{const rows=tasks.filter(test);if(!rows.length)return'';found=true;return `<section style="margin-bottom:22px"><div class="panel-head"><h2>${label}</h2><span class="chip">${rows.length}</span></div><div class="table-wrap">${taskTable(rows)}</div></section>`}).join('');return found?html:'<div class="table-wrap"><div class="empty"><strong>No tasks found</strong>Try changing your filters or create a new task.</div></div>'}
function taskTable(tasks){return `<table class="task-table"><thead><tr><th><input type="checkbox" id="selectAll"></th>${[['title','Task'],['status','Status'],['priority','Priority'],['projectId','Project'],['assigneeId','Assignee'],['dueDate','Due date']].map(([k,l])=>`<th data-sort="${k}">${l}</th>`).join('')}<th></th></tr></thead><tbody>${tasks.map(t=>`<tr><td><input class="task-check" type="checkbox" value="${t.taskId}" ${App.state.selected.has(t.taskId)?'checked':''}></td><td><div class="task-title" data-task="${t.taskId}">${esc(t.title)}</div><div class="meta">${esc((t.description||'').slice(0,70))}</div></td><td><select class="field inline-edit status-${t.status}" data-inline-task="${t.taskId}" data-inline-field="status" aria-label="Status">${Object.entries(App.labels).map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}</select></td><td><select class="field inline-edit priority-${t.priority}" data-inline-task="${t.taskId}" data-inline-field="priority" aria-label="Priority">${App.priorities.map(v=>`<option value="${v}" ${t.priority===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></td><td>${esc(project(t.projectId).name)}</td><td><div class="assignees" title="${esc(person(t.assigneeId).displayName)}">${avatar(person(t.assigneeId))}</div></td><td>${fmtDate(t.dueDate)}</td><td><button class="icon-btn" data-task="${t.taskId}" aria-label="Open task">›</button></td></tr>`).join('')}</tbody></table>`}
function kanbanView(){const tasks=filteredTasks().filter(t=>t.status!=='cancelled');return `${pageHead('Workflow','Kanban Board','Move work through each stage and keep momentum visible.','<button class="btn btn-primary" data-add>＋ New task</button>')}${taskFilters()}<div class="kanban">${['backlog','todo','in_progress','in_review','done'].map(status=>{const own=tasks.filter(t=>t.status===status);return `<section class="kanban-col" data-status="${status}"><div class="kanban-head"><span>${App.labels[status]}</span><span class="chip">${own.length}</span></div><div class="kanban-list">${own.map(t=>`<article class="kanban-card" draggable="true" data-task="${t.taskId}">${chip('priority',t.priority)}<h3>${esc(t.title)}</h3><div class="meta">${esc(project(t.projectId).name)}</div><div class="card-footer"><span class="meta">${fmtDate(t.dueDate)}</span>${avatar(person(t.assigneeId))}</div><select class="field status-alternative" aria-label="Change status">${Object.entries(App.labels).slice(0,5).map(([v,l])=>`<option value="${v}" ${v===t.status?'selected':''}>${l}</option>`).join('')}</select></article>`).join('')}</div></section>`}).join('')}</div>`}
function projectsView(){return `${pageHead('Portfolio','Projects','Track progress across the work your team can access.',App.state.data.user.role==='admin'?'<button class="btn btn-primary" id="newProject">＋ New project</button>':'')}<div class="project-cards">${App.state.data.projects.map(projectCard).join('')||'<div class="empty"><strong>No projects available</strong>Ask your administrator for project access.</div>'}</div>`}
function profileView(){const u=App.state.data.user;return `${pageHead('Account','My Profile','Identity comes from your corporate Google Workspace account.')}<section class="panel" style="max-width:700px"><div style="display:flex;gap:16px;align-items:center">${avatar(u)}<div><h2>${esc(u.displayName||'Profile unresolved')}</h2><div class="meta">${esc(u.email)} · ${esc(u.role)}</div></div></div><div class="detail-grid"><div class="control"><label>Profile status</label><div>${esc(u.profileStatus)}</div></div><div class="control"><label>Account status</label><div>${esc(u.status)}</div></div><div class="control"><label>First login</label><div>${esc(u.firstLoginAt||'—')}</div></div><div class="control"><label>Last active</label><div>${esc(u.lastActiveAt||'—')}</div></div></div></section>`}
function settingsView(){const d=App.state.data.diagnostics,isAdmin=App.state.data.user.role==='admin';return `${pageHead('Workspace','Settings','Appearance, access management, and authentication diagnostics.')}<section class="panel" style="max-width:900px"><div class="control"><label>Appearance</label><select id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option></select></div><br><h2>Authentication diagnostics</h2><div class="detail-grid"><div class="control"><label>Active identity</label><div>${esc(d.activeUserEmail)}</div></div><div class="control"><label>Profile resolution</label><div>${esc(d.profileStatus)}</div></div><div class="control"><label>Effective user</label><div>${esc(d.effectiveUserEmail)}</div></div><div class="control"><label>Role</label><div>${esc(d.role)}</div></div></div><p class="meta">${esc(d.deploymentNote)}</p>${isAdmin?'<hr style="border:0;border-top:1px solid var(--line);margin:24px 0"><div class="panel-head"><h2>Authorised employees</h2><button class="btn btn-primary" id="addEmployee">＋ Add employee</button></div><div id="adminUsers"><div class="meta">Loading employees…</div></div>':''}</section>`}
function bindView(){ $$('[data-view]').forEach(el=>el.onclick=()=>navigate(el.dataset.view));$$('[data-add]').forEach(el=>el.onclick=openTaskModal);$$('[data-task]').forEach(el=>el.onclick=e=>{if(!e.target.closest('.status-alternative,.task-check,.inline-edit'))openTask(el.dataset.task)});$$('[data-project-detail]').forEach(el=>el.onclick=()=>openProjectDetail(el.dataset.projectDetail));$$('[data-inline-task]').forEach(el=>el.onchange=()=>saveInlineTask(el));$('#taskSearch')?.addEventListener('input',debounce(e=>{App.state.filters.search=e.target.value;render()},250));$$('[data-filter]').forEach(el=>el.onchange=()=>{App.state.filters[el.dataset.filter]=el.value;render()});if($('#clearFilters'))$('#clearFilters').onclick=()=>{App.state.filters={};render()};$$('[data-sort]').forEach(el=>el.onclick=()=>{App.state.sort={key:el.dataset.sort,dir:App.state.sort.key===el.dataset.sort?-App.state.sort.dir:1};render()});$$('.task-check').forEach(el=>el.onchange=()=>{el.checked?App.state.selected.add(el.value):App.state.selected.delete(el.value);render()});if($('#selectAll'))$('#selectAll').onchange=e=>{filteredTasks().forEach(t=>e.target.checked?App.state.selected.add(t.taskId):App.state.selected.delete(t.taskId));render()};if($('#clearSelection'))$('#clearSelection').onclick=()=>{App.state.selected.clear();render()};if($('#bulkStatus'))$('#bulkStatus').onchange=bulkUpdate;if($('#newProject'))$('#newProject').onclick=openProjectModal;if($('#themeSelect')){$('#themeSelect').value=App.state.theme;$('#themeSelect').onchange=e=>setTheme(e.target.value)}if($('#addEmployee')){$('#addEmployee').onclick=openEmployeeModal;loadAdminUsers()}bindKanban()}
function navigate(view){App.state.view=view;App.state.selected.clear();render();document.body.classList.remove('nav-open');$('.sidebar').classList.remove('open')}
function taskForm(t={}){return `<div class="form-grid"><div class="control span-2"><label>Title *</label><input name="title" required maxlength="300" value="${esc(t.title||'')}"></div><div class="control span-2"><label>Description</label><textarea name="description">${esc(t.description||'')}</textarea></div><div class="control"><label>Status *</label><select name="status">${Object.entries(App.labels).map(([v,l])=>`<option value="${v}" ${(t.status||'todo')===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="control"><label>Priority *</label><select name="priority">${App.priorities.map(v=>`<option value="${v}" ${(t.priority||'medium')===v?'selected':''}>${v[0].toUpperCase()+v.slice(1)}</option>`).join('')}</select></div><div class="control"><label>Project *</label><select name="projectId" required>${App.state.data.projects.map(p=>`<option value="${p.projectId}" ${t.projectId===p.projectId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="control"><label>Assignee *</label><input id="assigneeSearch" placeholder="Search employees" autocomplete="off"><select name="assigneeId" required></select></div><div class="control"><label>Start date</label><input type="date" name="startDate" value="${esc(t.startDate||'')}"></div><div class="control"><label>Due date *</label><input type="date" name="dueDate" required value="${esc(t.dueDate||'')}"></div><div class="control"><label>Tags</label><input name="tags" placeholder="Design, launch" value="${esc((t.tags||[]).join(', '))}"></div><div class="control"><label>Estimated effort</label><input name="estimatedEffort" placeholder="e.g. 4h" value="${esc(t.estimatedEffort||'')}"></div></div>`}
function eligibleAssignees(projectId,query=''){query=query.toLowerCase();return App.state.data.users.filter(u=>(u.projectIds||[]).includes(projectId)&&(!query||(u.displayName+' '+u.email).toLowerCase().includes(query)))}
function populateAssignees(form,selected){const projectId=form.elements.projectId.value,select=form.elements.assigneeId,query=$('#assigneeSearch',form)?.value||'',users=eligibleAssignees(projectId,query),desired=selected||select.value||App.state.data.user.userId;select.innerHTML=users.map(u=>`<option value="${u.userId}" ${u.userId===desired?'selected':''}>${esc(u.displayName||u.email)}</option>`).join('');if(!users.length)select.innerHTML='<option value="">No authorised employees</option>'}
function bindAssigneePicker(form,selected){populateAssignees(form,selected);form.elements.projectId.onchange=()=>populateAssignees(form);$('#assigneeSearch',form).oninput=debounce(()=>populateAssignees(form,selected),150)}
function openTaskModal(){if(!App.state.data.projects.length)return toast('Create a project before adding tasks.','error');modal('Create task',`<form id="taskForm">${taskForm()}</form>`,'Create task',async()=>{const form=$('#taskForm'),fd=new FormData(form);if(!form.reportValidity())return false;const input=Object.fromEntries(fd);input.tags=input.tags.split(',').map(x=>x.trim()).filter(Boolean);const task=await call('apiCreateTask',input);App.state.data.tasks.unshift(task);refreshDerived();toast('Task created');return true});bindAssigneePicker($('#taskForm'))}
function modal(title,body,submitLabel,onSubmit){$('#modalRoot').innerHTML=`<div class="modal-backdrop"></div><section class="modal"><div class="modal-head"><strong>${esc(title)}</strong><button class="icon-btn" data-close>×</button></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="btn btn-secondary" data-close>Cancel</button><button class="btn btn-primary" id="modalSubmit">${esc(submitLabel)}</button></div></section>`;$$('[data-close]',$('#modalRoot')).forEach(x=>x.onclick=closeModal);$('#modalSubmit').onclick=async()=>{const btn=$('#modalSubmit');btn.disabled=true;try{if(await onSubmit()!==false)closeModal()}catch(e){toast(e.message,'error')}finally{btn.disabled=false}}}
function closeModal(){$('#modalRoot').innerHTML=''}
async function openTask(id){$('#scrim').hidden=false;$('#drawer').classList.add('open');$('#drawer').setAttribute('aria-hidden','false');$('#drawer').innerHTML='<div class="page-loader"><div class="spinner"></div></div>';try{App.state.detail=await call('apiGetTaskDetail',id);renderDrawer()}catch(e){toast(e.message,'error');closeDrawer()}}
function renderDrawer(tab='subtasks'){const d=App.state.detail,t=d.task,assignees=eligibleAssignees(t.projectId);$('#drawer').innerHTML=`<div class="drawer-head"><span>${esc(project(t.projectId).name)}</span><button class="icon-btn" id="closeDrawer">×</button></div><div class="drawer-body"><input id="detailTitle" class="drawer-title" value="${esc(t.title)}"><div class="detail-grid">${[['status','Status',Object.entries(App.labels)],['priority','Priority',App.priorities.map(x=>[x,x[0].toUpperCase()+x.slice(1)] )]].map(([n,l,opts])=>`<div class="control"><label>${l}</label><select data-detail="${n}">${opts.map(([v,x])=>`<option value="${v}" ${t[n]===v?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}<div class="control"><label>Assignee</label><input id="detailAssigneeSearch" placeholder="Search employees" autocomplete="off"><select data-detail="assigneeId">${assignees.map(u=>`<option value="${u.userId}" ${t.assigneeId===u.userId?'selected':''}>${esc(u.displayName)}</option>`).join('')}</select></div><div class="control"><label>Due date</label><input type="date" data-detail="dueDate" value="${esc(t.dueDate)}"></div></div><div class="control"><label>Description</label><textarea data-detail="description">${esc(t.description)}</textarea></div><div class="tabs"><button class="tab ${tab==='subtasks'?'active':''}" data-tab="subtasks">Subtasks</button><button class="tab ${tab==='comments'?'active':''}" data-tab="comments">Comments</button><button class="tab ${tab==='activity'?'active':''}" data-tab="activity">Activity</button></div><div id="detailTab">${detailTab(tab,d)}</div><br><button class="btn btn-danger" id="archiveTask">Archive task</button></div>`;$('#closeDrawer').onclick=closeDrawer;$('#detailTitle').onchange=e=>saveDetail({title:e.target.value});$$('[data-detail]').forEach(el=>el.onchange=()=>saveDetail({[el.dataset.detail]:el.value}));$('#detailAssigneeSearch').oninput=debounce(e=>{const select=$('[data-detail="assigneeId"]'),users=eligibleAssignees(t.projectId,e.target.value);select.innerHTML=users.map(u=>`<option value="${u.userId}" ${t.assigneeId===u.userId?'selected':''}>${esc(u.displayName)}</option>`).join('')},150);$$('[data-tab]').forEach(el=>el.onclick=()=>renderDrawer(el.dataset.tab));$('#archiveTask').onclick=archiveTask;bindDetailTab(tab)}
function detailTab(tab,d){if(tab==='subtasks')return `<div class="timeline">${d.subtasks.map(s=>`<label class="focus-item"><input type="checkbox" data-subtask="${s.subtaskId}" ${s.completed?'checked':''}><span>${esc(s.title)}</span></label>`).join('')||'<div class="meta">No subtasks yet.</div>'}</div><form class="comment-form" id="subtaskForm"><input class="field" name="title" placeholder="Add a subtask"><button class="btn btn-secondary">Add</button></form>`;if(tab==='comments')return `<div class="timeline">${d.comments.map(c=>`<div class="comment"><strong>${esc(c.author?.displayName||'Unknown')}</strong><p>${esc(c.content)}</p><span class="meta">${new Date(c.createdAt).toLocaleString()}</span></div>`).join('')||'<div class="meta">No comments yet.</div>'}</div><form class="comment-form" id="commentForm"><input class="field" name="content" placeholder="Write a comment"><button class="btn btn-secondary">Post</button></form>`;return `<div class="timeline">${d.activity.map(a=>`<div class="timeline-item"><strong>${esc((a.action||'updated').replaceAll('_',' '))}</strong><div class="meta">${esc(a.actor?.displayName||'System')} · ${new Date(a.createdAt).toLocaleString()}</div></div>`).join('')||'<div class="meta">No activity yet.</div>'}</div>`}
function bindDetailTab(tab){if(tab==='subtasks'){$$('[data-subtask]').forEach(el=>el.onchange=async()=>{await call('apiToggleSubtask',el.dataset.subtask,el.checked);App.state.detail=await call('apiGetTaskDetail',App.state.detail.task.taskId);renderDrawer('subtasks')});$('#subtaskForm').onsubmit=async e=>{e.preventDefault();const title=new FormData(e.target).get('title');if(!title)return;await call('apiAddSubtask',App.state.detail.task.taskId,title);App.state.detail=await call('apiGetTaskDetail',App.state.detail.task.taskId);renderDrawer('subtasks')}}if(tab==='comments')$('#commentForm').onsubmit=async e=>{e.preventDefault();const content=new FormData(e.target).get('content');if(!content)return;await call('apiAddComment',App.state.detail.task.taskId,content);App.state.detail=await call('apiGetTaskDetail',App.state.detail.task.taskId);renderDrawer('comments')}}
async function saveDetail(patch){try{const updated=await call('apiUpdateTask',App.state.detail.task.taskId,patch,App.state.detail.task.version);App.state.detail.task=updated;const i=App.state.data.tasks.findIndex(t=>t.taskId===updated.taskId);App.state.data.tasks[i]=updated;refreshDerived(false);toast('Changes saved')}catch(e){toast(e.message,'error');App.state.detail=await call('apiGetTaskDetail',App.state.detail.task.taskId);renderDrawer()}}
async function archiveTask(){if(!confirm('Archive this task?'))return;try{await call('apiArchiveTask',App.state.detail.task.taskId,App.state.detail.task.version);App.state.data.tasks=App.state.data.tasks.filter(t=>t.taskId!==App.state.detail.task.taskId);closeDrawer();refreshDerived();toast('Task archived')}catch(e){toast(e.message,'error')}}
function closeDrawer(){$('#drawer').classList.remove('open');$('#drawer').setAttribute('aria-hidden','true');$('#scrim').hidden=true;App.state.detail=null}
function bindKanban(){let dragged;$$('.kanban-card').forEach(card=>{card.ondragstart=()=>{dragged=card.dataset.task;card.classList.add('dragging')};card.ondragend=()=>card.classList.remove('dragging');$('.status-alternative',card).onchange=e=>{e.stopPropagation();moveTask(card.dataset.task,e.target.value)}});$$('.kanban-list').forEach(list=>{list.ondragover=e=>e.preventDefault();list.ondrop=e=>{e.preventDefault();if(dragged)moveTask(dragged,list.closest('.kanban-col').dataset.status)}})}
async function moveTask(id,status){const t=App.state.data.tasks.find(x=>x.taskId===id),old=t.status;if(old===status)return;t.status=status;render();try{const updated=await call('apiReorderTask',id,status,Date.now(),t.version);Object.assign(t,updated);refreshDerived(false)}catch(e){t.status=old;render();toast(e.message,'error')}}
async function saveInlineTask(el){const task=App.state.data.tasks.find(t=>t.taskId===el.dataset.inlineTask),field=el.dataset.inlineField,previous=task[field];el.disabled=true;task[field]=el.value;try{const updated=await call('apiUpdateTask',task.taskId,{[field]:el.value},task.version);Object.assign(task,updated);await refreshDerived(false);toast('Task updated')}catch(e){task[field]=previous;el.value=previous;toast(e.message,'error')}finally{el.disabled=false}}
async function bulkUpdate(){const status=$('#bulkStatus').value;if(!status)return;try{const rows=await call('apiBulkUpdateTasks',Array.from(App.state.selected),{status});rows.forEach(row=>Object.assign(App.state.data.tasks.find(t=>t.taskId===row.taskId),row));App.state.selected.clear();refreshDerived();toast('Tasks updated')}catch(e){toast(e.message,'error')}}
function openProjectModal(){modal('Create project','<form id="projectForm" class="form-grid"><div class="control span-2"><label>Name *</label><input name="name" required maxlength="120"></div><div class="control span-2"><label>Description</label><textarea name="description"></textarea></div></form>','Create project',async()=>{const f=$('#projectForm');if(!f.reportValidity())return false;const row=await call('apiCreateProject',Object.fromEntries(new FormData(f)));row.taskCount=0;row.completedCount=0;row.progress=0;App.state.data.projects.push(row);render();toast('Project created');return true})}
function openProjectDetail(id){const p=project(id),tasks=App.state.data.tasks.filter(t=>t.projectId===id),admin=App.state.data.user.role==='admin';modal(p.name,`<form id="projectDetailForm" class="form-grid"><div class="control span-2"><label>Name</label><input name="name" value="${esc(p.name)}" ${admin?'':'disabled'}></div><div class="control span-2"><label>Description</label><textarea name="description" ${admin?'':'disabled'}>${esc(p.description||'')}</textarea></div><div class="control"><label>Status</label><select name="status" ${admin?'':'disabled'}>${['active','on_hold','completed','archived'].map(v=>`<option value="${v}" ${p.status===v?'selected':''}>${v.replace('_',' ')}</option>`).join('')}</select></div><div class="control"><label>Progress</label><div class="progress"><i style="width:${p.progress}%"></i></div><div class="meta">${p.completedCount}/${p.taskCount} tasks · ${p.progress}%</div></div><div class="span-2"><div class="panel-head"><h2>Project tasks</h2><button type="button" class="btn btn-secondary" id="openProjectTasks">View task list</button></div><div class="focus-list">${tasks.slice(0,6).map(focusItem).join('')||'<div class="meta">No tasks in this project yet.</div>'}</div></div></form>`,admin?'Save changes':'Close',async()=>{if(!admin)return true;const f=$('#projectDetailForm');const updated=await call('apiUpdateProject',id,Object.fromEntries(new FormData(f)));Object.assign(p,updated);render();toast('Project updated');return true});$('#openProjectTasks').onclick=()=>{closeModal();App.state.filters={projectId:id};navigate('all-tasks')};$$('[data-task]',$('#projectDetailForm')).forEach(el=>el.onclick=()=>{closeModal();openTask(el.dataset.task)})}
async function loadAdminUsers(){const root=$('#adminUsers');if(!root)return;try{const users=await call('apiListAdminUsers');root.innerHTML=users.length?`<div class="table-wrap"><table class="task-table"><thead><tr><th>Employee</th><th>Role</th><th>Status</th><th>Project access</th></tr></thead><tbody>${users.map(u=>`<tr><td><div style="display:flex;align-items:center;gap:9px">${avatar(u)}<div><strong>${esc(u.displayName||'Profile unresolved')}</strong><div class="meta">${esc(u.email)}</div></div></div></td><td><select class="field" data-user-role="${u.userId}"><option value="member" ${u.role==='member'?'selected':''}>Member</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select></td><td><select class="field" data-user-status="${u.userId}"><option value="active" ${u.status==='active'?'selected':''}>Active</option><option value="disabled" ${u.status==='disabled'?'selected':''}>Disabled</option></select></td><td><div style="display:flex;gap:8px;flex-wrap:wrap">${App.state.data.projects.map(p=>`<label class="chip"><input type="checkbox" data-membership="${p.projectId}|${u.userId}" ${(u.projectIds||[]).includes(p.projectId)?'checked':''}> ${esc(p.name)}</label>`).join('')||'<span class="meta">No projects</span>'}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><strong>No employees</strong>Provision the first team member.</div>';$$('[data-user-role]',root).forEach(el=>el.onchange=()=>updateAdminUser(el.dataset.userRole,{role:el.value}));$$('[data-user-status]',root).forEach(el=>el.onchange=()=>updateAdminUser(el.dataset.userStatus,{status:el.value}));$$('[data-membership]',root).forEach(el=>el.onchange=async()=>{const [projectId,userId]=el.dataset.membership.split('|');el.disabled=true;try{await call('apiSetProjectMembership',projectId,userId,el.checked);toast('Project access updated')}catch(e){el.checked=!el.checked;toast(e.message,'error')}finally{el.disabled=false}})}catch(e){root.innerHTML=`<div class="empty"><strong>Employees could not load</strong>${esc(e.message)}</div>`}}
async function updateAdminUser(userId,patch){try{await call('apiUpdateUser',userId,patch);toast('Employee updated');await refreshDerived(false)}catch(e){toast(e.message,'error');loadAdminUsers()}}
function openEmployeeModal(){modal('Authorise employee','<form id="employeeForm" class="form-grid"><div class="control span-2"><label>Corporate email *</label><input type="email" name="email" required autocomplete="off"></div><div class="control span-2"><label>Application role</label><select name="role"><option value="member">Member</option><option value="admin">Admin</option></select></div><p class="meta span-2">The employee name is resolved from the approved Workspace directory source. It is never inferred from the email address.</p></form>','Authorise employee',async()=>{const f=$('#employeeForm');if(!f.reportValidity())return false;await call('apiProvisionUser',Object.fromEntries(new FormData(f)));await refreshDerived(false);loadAdminUsers();toast('Employee authorised');return true})}
async function refreshDerived(shouldRender=true){const fresh=await call('getBootstrapData');App.state.data=fresh;if(shouldRender)render()}
function debounce(fn,wait){let timer;return(...args)=>{clearTimeout(timer);timer=setTimeout(()=>fn(...args),wait)}}
async function boot(){setTheme(App.state.theme,false);renderNav();$('#themeBtn').onclick=()=>setTheme(App.state.theme==='light'?'dark':'light');$('#quickAddBtn').onclick=openTaskModal;$('#menuBtn').onclick=()=>$('.sidebar').classList.add('open');$('#collapseBtn').onclick=()=>$('.sidebar').classList.remove('open');$('#scrim').onclick=closeDrawer;$('#globalSearch').addEventListener('input',debounce(e=>{App.state.filters.search=e.target.value;if(e.target.value)navigate('all-tasks')},350));document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer()}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('#globalSearch').focus()}});try{App.state.data=await call('getBootstrapData');if(!urlState.get('theme')&&App.state.data.preferences.theme)setTheme(App.state.data.preferences.theme,false);renderUser();render()}catch(e){$('#main').innerHTML=`<section class="error-page"><div class="eyebrow">Access unavailable</div><h1>TeamSync couldn’t open</h1><p>${esc(e.message)}</p><p class="error-code">${esc(e.code||'STARTUP_ERROR')}</p><p class="meta">If you are an administrator, verify the script properties, initialize the spreadsheet schema, and check the web app deployment settings.</p></section>`}}
boot();
</script>
